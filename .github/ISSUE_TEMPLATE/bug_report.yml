name: Bug report
description: Tell StyleUp Fantasy Apps about something that is not working on RankUp Fantasy.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Tell us what went wrong. That is all we need to get started.
  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      placeholder: I tapped a player, but the next matchup did not load.
    validations:
      required: true
  - type: input
    id: page_device
    attributes:
      label: Page or device (optional)
      placeholder: Rankings page on iPhone
